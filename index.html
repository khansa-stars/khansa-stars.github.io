<style>
:root{
  --bg:#f6f3ea; --card:#fffdf9; --ink:#1b2b29; --muted:#687673; --line:#e4decf; --line2:#efeadd;
  --teal:#0f6b62; --teal-d:#0a4a44; --teal-dd:#06302d; --teal-l:#dcefea; --teal-ll:#eff8f5;
  --gold:#b08d57; --gold-d:#86683a; --gold-l:#f5ecd9; --gold-ll:#fbf6ea;
  --rose:#b3432e; --rose-l:#fbe8e3;
  --b6:#0f6b62; --b4:#a8813f; --b2:#48699a; --bm:#7a5690;
  --r:14px; --shadow:0 1px 2px rgba(20,40,36,.06),0 6px 20px rgba(20,40,36,.06);
  --font:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic","Sakkal Majalla","Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;line-height:1.3}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
svg{display:block;flex:none}
[hidden]{display:none!important}

/* ── buttons & fields ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.5em .95em;font-weight:600;min-height:40px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:#d8d2e2;background:#fff}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d);border-color:var(--teal-d)}
.btn.gold{background:var(--gold-l);border-color:#e3d3b1;color:var(--gold-d)}
.btn.danger{color:var(--rose);border-color:#eccfc7;background:var(--rose-l)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(0,0,0,.05)}
.btn.sm{min-height:32px;padding:.25em .7em;font-size:15px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:.3em;margin-bottom:.9em}
.field>span{font-size:15px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.55em .75em;min-height:42px;outline:none}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,107,98,.14)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)} .small{font-size:15px} .tiny{font-size:14px}
.err{background:var(--rose-l);color:var(--rose);border:1px solid #eccfc7;border-radius:10px;padding:.6em .8em;font-weight:600;margin-bottom:.8em}
.note{background:var(--gold-ll);border:1px solid #ecdfc3;border-radius:10px;padding:.6em .8em;color:#6d5630}

/* ── auth screens ── */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(1200px 600px at 80% -10%,#16857a 0,transparent 60%),linear-gradient(160deg,var(--teal-d),var(--teal-dd))}
.auth-card{width:min(440px,100%);background:var(--card);border-radius:22px;padding:28px 26px 24px;box-shadow:0 30px 80px rgba(0,0,0,.35);border-top:5px solid var(--gold)}
.auth-card.wide{width:min(560px,100%)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.logo{width:50px;height:50px;border-radius:14px;background:linear-gradient(150deg,var(--teal),var(--teal-dd));display:grid;place-items:center;color:#f1dfb9;flex:none}
.brand h1{font-size:21.5px} .brand p{margin:2px 0 0;color:var(--muted);font-size:15.5px}

/* ── shell ── */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--teal-d),#083f3a);color:#fff;border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1500px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.1)}
.top h1{font-size:18.5px} .top .sub{font-size:14px;opacity:.75}
.nav{display:flex;gap:4px;margin-inline-start:auto;background:rgba(255,255,255,.08);padding:4px;border-radius:12px}
.nav button{border:0;background:transparent;color:#d9ece8;padding:.45em .95em;border-radius:9px;font-weight:600;display:flex;gap:.4em;align-items:center}
.nav button.on{background:#fff;color:var(--teal-d)}
.user{display:flex;align-items:center;gap:8px}
.user .who{text-align:start;line-height:1.25} .user .who b{display:block;font-size:15.5px} .user .who span{font-size:13px;opacity:.75}
.top .btn.ghost{color:#fff;min-height:36px;padding:.3em .6em}
.top .btn.ghost:hover{background:rgba(255,255,255,.12)}
main{max-width:1500px;margin:auto;padding:16px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.section-title{font-size:19.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:.5em}

/* ── pills / segmented ── */
.seg{display:inline-flex;background:#efecf5;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:.38em .85em;font-weight:600;color:#5b6360;min-height:34px}
.seg button.on{background:#fff;color:var(--teal-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.32em .85em;font-weight:600;min-height:36px;display:inline-flex;gap:.4em;align-items:center}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip .n{font-size:13px;opacity:.7;font-weight:500}
.tabs{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.tab{flex:1 1 220px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:.7em 1em;text-align:start;display:flex;gap:.7em;align-items:center}
.tab .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--line2);color:var(--muted)}
.tab b{display:block;font-size:17.5px} .tab span{font-size:14.5px;color:var(--muted)}
.tab.on{border-color:var(--teal);background:var(--teal-ll);box-shadow:inset 0 0 0 1px var(--teal)}
.tab.on .ic{background:var(--teal);color:#fff}
.tab.on.gold{border-color:var(--gold);background:var(--gold-ll);box-shadow:inset 0 0 0 1px var(--gold)}
.tab.on.gold .ic{background:var(--gold);color:#fff}
.toolbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.lbl{font-size:14.5px;font-weight:700;color:var(--muted);margin-inline-end:2px}

/* ── search ── */
.search{position:relative;flex:1 1 230px;max-width:360px}
.search input{padding-inline-start:2.4em}
.search>span:first-child{position:absolute;inset-inline-start:.75em;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.results{position:absolute;z-index:20;top:calc(100% + 4px);inset-inline:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:320px;overflow:auto}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;padding:.6em .8em;text-align:start;border-bottom:1px solid var(--line2)}
.results button:hover{background:var(--teal-ll)}
.results .empty{padding:.8em;color:var(--muted)}

/* ── grid ── */
.gridwrap{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);max-height:calc(100dvh - 150px)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
.grid th,.grid td{border-bottom:1px solid var(--line2);border-inline-start:1px solid var(--line2);padding:6px 6px;text-align:center;background:var(--card)}
.grid thead th{position:sticky;top:0;z-index:3;background:#f5f2f9;font-size:14.5px;font-weight:700;vertical-align:bottom;line-height:1.35}
.grid thead tr.bands th{top:0;height:30px;color:#fff;font-size:14px;padding:4px 8px;white-space:nowrap}
.grid thead tr.heads.under th{top:30px}
.grid .namecol{position:sticky;right:0;z-index:2;text-align:start;min-width:210px;max-width:260px;border-inline-start:0;box-shadow:-6px 0 8px -6px rgba(0,0,0,.12)}
.grid thead .namecol{z-index:5}
.grid td.namecol button{border:0;background:transparent;text-align:start;padding:2px 0;font-weight:600;display:flex;gap:8px;align-items:baseline;width:100%}
.grid td.namecol button:hover .nm{color:var(--teal);text-decoration:underline}
.grid .ix{color:var(--muted);font-size:14px;min-width:1.5em}
.grid tbody tr:nth-child(even) td{background:#fdfcfe}
.grid tbody tr:hover td{background:var(--teal-ll)}
.grid tr.hl td{background:var(--gold-l)!important}
.grid th.item{min-width:74px;max-width:104px;white-space:normal;font-weight:600}
.grid th.item.p{width:104px}
.grid th.item .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gold);color:var(--teal);font-size:14px;margin-bottom:3px}
.grid th.tot,.grid td.tot{min-width:76px;background:#f5f2f9;font-weight:700;position:sticky;left:0;z-index:2;box-shadow:6px 0 8px -6px rgba(0,0,0,.12)}
.grid thead th.tot{z-index:5}
.grid tbody tr:nth-child(even) td.tot,.grid tbody tr:hover td.tot{background:#f5f2f9}
.pts b{font-size:19.5px;color:var(--teal-d)} .pts .of{font-size:13px;color:var(--muted);font-weight:500}
.pts .raw{display:block;font-size:12px;color:var(--gold-d);font-weight:600}
.pts.full b{color:var(--gold-d)}
.cell{display:inline-flex;align-items:center;gap:4px}
.cnt{min-width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;font-weight:700;font-size:17px;color:#b7b3c2;padding:0 4px}
.cnt.has{background:var(--teal-l);color:var(--teal-d);border-color:#c4e2da}
.cnt.has:hover{background:#cbe7df}
.cnt:hover{border-color:var(--line)}
.add{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--teal);background:#fff;color:var(--teal);display:grid;place-items:center;padding:0;transition:background .15s,color .15s}
.add:hover{background:var(--teal);color:#fff}
.add.busy{background:var(--teal);color:#fff;border-color:var(--teal);pointer-events:none;animation:pop .35s ease}
.add:disabled{border-color:var(--line);color:#c9c2b0;background:#f6f3ea;cursor:not-allowed}
.done{display:inline-flex;align-items:center;gap:4px;background:var(--teal);color:#fff;border:0;border-radius:9px;height:34px;padding:0 10px;font-weight:700;font-size:15px}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.band6{background:var(--b6)!important}.band4{background:var(--b4)!important}.band2{background:var(--b2)!important}.bandm{background:var(--bm)!important}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}

/* ── نظام النقاط ── */
.catbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.catchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.3em .9em .3em .8em;font-weight:600;min-height:40px;display:inline-flex;gap:.5em;align-items:center}
.catchip i{width:13px;height:13px;border-radius:50%;display:inline-block;flex:none}
.catchip.on{color:#fff;border-color:transparent}
.catchip.on i{background:#fff!important}
.budget{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;min-width:230px;margin-inline-start:auto}
.budget .big{font-size:21px;color:var(--teal-d)}
.budget.out{border-color:#eccfc7;background:var(--rose-l)} .budget.out .big{color:var(--rose)}
.budget .bar i{background:linear-gradient(90deg,var(--teal),#3aa392)}
.segbar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:#ece8f1;min-width:60px}
.segbar i{display:block;height:100%}
.segbar.thick{height:14px}
.ptot{display:grid;gap:4px;min-width:84px} .ptot b{font-size:19.5px;color:var(--teal-d)}
.catpts{display:inline-grid;place-items:center;min-width:40px;height:34px;border-radius:9px;font-weight:700;border:0;padding:0 8px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.cathead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin:14px 0 4px;padding-bottom:4px;border-bottom:2px solid}
.cathead i{width:12px;height:12px;border-radius:50%} .cathead span{margin-inline-start:auto;font-size:14px}

/* ── بوابة أولياء الأمور ── */
.pwrap{min-height:100dvh;background:var(--bg)}
.phead{background:radial-gradient(900px 400px at 85% -20%,#178577 0,transparent 60%),linear-gradient(160deg,#0a4a44,#06302d);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 54px;border-bottom:3px solid var(--gold)}
.phead-in{max-width:620px;margin:auto;display:flex;gap:12px;align-items:center}
.phead h1{font-size:22.5px} .phead p{margin:2px 0 0;opacity:.85;font-size:15px}
.pbody{max-width:620px;margin:-38px auto 0;padding:0 14px 60px;display:grid;gap:14px}
.ptotal{display:flex;align-items:baseline;gap:10px;margin-bottom:10px} .ptotal b{font-size:46.5px;line-height:1;color:var(--teal-d)}
.pcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.pcat{border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.pcat b{font-size:20px}
.pday{font-weight:700;font-size:15px;color:var(--muted);margin:12px 0 4px}
.paward{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.paward i{width:12px;height:12px;border-radius:50%;flex:none} .paward .t{flex:1;min-width:0} .paward small{display:block;color:var(--muted);font-size:13px}
.qblock{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.qblock>b{display:block;margin-bottom:8px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1.500px solid var(--line);background:#fff;border-radius:10px;padding:.45em .9em;font-weight:600;min-height:42px}
.opt.on{background:var(--teal);border-color:var(--teal);color:#fff}
.rbar{display:grid;grid-template-columns:90px 1fr 84px;gap:8px;align-items:center;font-size:14.5px;margin:3px 0}
.rbar .bar{margin:0;height:10px} .rbar .bar i{background:var(--teal)}

/* ── list mode (phones) ── */
.itempick{display:flex;gap:6px;overflow:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.itempick .chip{flex:none;scroll-snap-align:start}
.itemhead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;background:#f5f2f9;border-radius:var(--r) var(--r) 0 0}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:.12em .65em;font-size:14px;font-weight:700;color:#fff;white-space:nowrap}
.slist .srow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line2)}
.slist .srow:last-child{border-bottom:0}
.slist .srow.hl{background:var(--gold-l)}
.slist .nm{flex:1;min-width:0;border:0;background:transparent;text-align:start;font-weight:600;padding:6px 0}
.slist .cnt,.slist .add{width:44px;height:44px;min-width:44px;font-size:19.5px}

/* ── dialogs ── */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);color:var(--ink);background:var(--card);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog.wide{width:min(860px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(6,36,33,.55);backdrop-filter:blur(2px)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;background:var(--teal-ll)}
.dlg-h h2{font-size:19.5px} .dlg-h p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.dlg-b{padding:16px 18px;overflow:auto}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;background:#faf9fc}
.x{margin-inline-start:auto;border:0;background:transparent;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:rgba(0,0,0,.07)}
.occ{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.occ.del{opacity:.6;background:#f6f1ee;border-style:dashed}
.occ-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.occ-n{width:26px;height:26px;border-radius:50%;background:var(--teal-l);color:var(--teal-d);display:grid;place-items:center;font-weight:700;font-size:14.5px;flex:none}
.occ-meta{font-size:14.5px;color:var(--muted);margin-top:4px}
.occ-note{margin-top:6px;background:var(--gold-ll);border-radius:8px;padding:6px 10px;font-size:16px;white-space:pre-wrap;word-break:break-word}
.addbox{border:1.5px dashed #b9d8d0;border-radius:12px;padding:12px;background:var(--teal-ll);margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2)}
.sheet-item .t{flex:1;min-width:0} .sheet-item .t small{display:block;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}
.tile b{font-size:27.5px;display:block;color:var(--teal-d);line-height:1.2} .tile span{font-size:14.5px;color:var(--muted)}
.tile.gold b{color:var(--gold-d)}
.bar{height:8px;border-radius:99px;background:#ece8f1;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#d5b072)}

/* ── tables (reports/admin) ── */
table.t{width:100%;border-collapse:collapse;font-size:16px}
.t th,.t td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:start;vertical-align:middle}
.t th{background:#f5f2f9;font-size:14.5px;white-space:nowrap;position:sticky;top:0}
.t td.c,.t th.c{text-align:center}
.t tr.grp td{background:var(--teal-l);font-weight:700;color:var(--teal-d)}
.t th.v{writing-mode:vertical-rl;white-space:normal;max-height:150px;min-width:28px;text-align:start;vertical-align:bottom;padding:8px 4px;font-weight:600;line-height:1.25}
.scroll{overflow:auto;max-height:calc(100dvh - 240px)}
.subtabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow:auto}
.subtabs button{border:0;background:transparent;padding:.6em 1em;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.subtabs button.on{color:var(--teal-d);border-color:var(--teal)}
.tag{display:inline-block;border-radius:6px;padding:.05em .5em;font-size:14px;font-weight:700;background:var(--line2);color:var(--muted)}
.tag.ok{background:var(--teal-l);color:var(--teal-d)} .tag.off{background:var(--rose-l);color:var(--rose)} .tag.gold{background:var(--gold-l);color:var(--gold-d)}
.print-head{display:none}

/* ── toasts ── */
#toasts{position:fixed;z-index:1000;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;background:#ffffff;color:#fff;border-radius:13px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:560px;animation:up .2s ease}
.toast.bad{background:#7d2b1c}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:.3em .7em;font-weight:700;white-space:nowrap}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(15,107,98,.2);border-top-color:var(--teal);animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{display:flex;gap:10px;align-items:center;justify-content:center;padding:40px;color:var(--muted)}

/* ── display (شاشة العرض للطالبات) ── */
.disp{min-height:100dvh;background:radial-gradient(1400px 700px at 85% -10%,#178577 0,transparent 60%),linear-gradient(160deg,#0a4a44,#052b28);color:#fff;padding:clamp(12px,2vw,28px)}
.disp-h{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vw,24px)}
.disp-h h1{font-size:clamp(20px,3vw,40px);font-weight:700} .disp-h p{margin:2px 0 0;opacity:.8;font-size:clamp(13px,1.4vw,19px)}
.disp-tools{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.disp-tools .seg{background:rgba(255,255,255,.12)} .disp-tools .seg button{color:#d7ebe6} .disp-tools .seg button.on{background:#fff;color:var(--teal-d)}
.disp .btn.ghost{color:#fff;border-color:rgba(255,255,255,.25)}
.disp-grid{display:grid;gap:clamp(10px,1.2vw,18px);grid-template-columns:repeat(auto-fill,minmax(clamp(210px,23vw,330px),1fr))}
.dcard{background:#fffdf8;color:var(--ink);border-radius:18px;padding:clamp(12px,1.3vw,20px);position:relative;border:2px solid transparent;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.dcard.star{border-color:#e2c283;background:linear-gradient(180deg,#fff9ea,#fffdf8)}
.dcard h3{font-size:clamp(14.5px,1.35vw,20px);margin-bottom:8px;padding-left:58px;min-height:2.7em;line-height:1.35}
.dcard .big{position:absolute;top:12px;left:14px;display:flex;align-items:center;gap:4px;font-weight:700;font-size:clamp(17px,1.7vw,24px);color:var(--gold-d)}
.dvals{display:flex;gap:5px;flex-wrap:wrap;min-height:28px;margin-top:10px}
.dval{border-radius:999px;font-weight:700;padding:.1em .65em;font-size:clamp(11.5px,1vw,14.5px);font-weight:600}
.dval b{margin-right:.4em;background:#fff;color:#1b2b29;border-radius:99px;padding:0 .45em;display:inline-block;min-width:1.5em;text-align:center}
.dpts{margin-top:10px;font-size:clamp(12px,1vw,14.5px);color:var(--muted);display:flex;justify-content:space-between}
.dpts b{color:var(--gold-d)}
.disp .legend{color:#fff;margin-bottom:14px;font-size:clamp(13px,1.2vw,17px)} .disp .legend i{width:14px;height:14px}
.disp-foot{margin-top:18px;opacity:.7;font-size:15px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media (max-width:760px){
  .nav{order:5;width:100%;margin:0;overflow:auto}.nav button{flex:1;justify-content:center;padding:.5em .5em;font-size:15.5px}
  .user .who{display:none} main{padding:12px 10px 90px} .g2{grid-template-columns:1fr}
  .top h1{font-size:16.5px} .gridwrap{max-height:none}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:13px}
  .top,.noprint,#toasts,.subtabs{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:0} .pad{padding:0}
  .scroll{overflow:visible;max-height:none}
  .print-head{display:block;margin-bottom:8px;border-bottom:2px solid #000;padding-bottom:6px}
  .print-head h2{font-size:18.5px} .print-head p{margin:2px 0 0}
  .t th{position:static;background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .t th,.t td{border:1px solid #999;padding:3px 5px}
  .t tr.grp td{background:#ddd!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{break-inside:avoid}
}

/* ═══════════ التصميم الفاتح: خلفية باستيل، ألوان الأقسام الخمسة، بلا ألوان غامقة ═══════════ */
:root{
  --bg:#fbf9f6; --card:#ffffff; --ink:#2c3848; --muted:#7a8696; --line:#e9e5f0; --line2:#f2eff6;
  --teal:#0f9a82; --teal-d:#0b8570; --teal-dd:#0b8570; --teal-l:#d6f5ee; --teal-ll:#effbf8;
  --gold:#f2a93b; --gold-d:#b06d14; --gold-l:#fff0d6; --gold-ll:#fff8ea;
  --rose:#d9483d; --rose-l:#fdeceb;
  --b6:#0f9a82; --b4:#f2a93b; --b2:#5b9bf0; --bm:#a47bd0;
  --r:18px; --shadow:0 1px 2px rgba(80,70,120,.05),0 10px 30px rgba(80,70,120,.08);
  --mesh:radial-gradient(900px 520px at 100% -10%,#dcf6ef 0,transparent 60%),radial-gradient(720px 520px at -10% 8%,#ffecd6 0,transparent 55%),radial-gradient(820px 620px at 55% 112%,#ebe3fb 0,transparent 60%),radial-gradient(600px 420px at 8% 100%,#dcebff 0,transparent 60%);
  --rainbow:linear-gradient(90deg,#5b9bf0,#35b97f,#f2b233,#a47bd0,#f08a3c);
}
body{background:var(--mesh),var(--bg);background-attachment:fixed}
.lic{display:inline-flex;flex:none;line-height:0}
.btn{border-radius:12px}
.btn.primary{box-shadow:0 6px 16px rgba(15,154,130,.25)}
.btn.gold{border-color:#ffdfa8}
.btn.danger{border-color:#f7cfcb}
.note{border-color:#ffe2ae;color:#8a5a12}
.err{border-color:#f7cfcb}

/* شاشات الدخول */
.auth{background:var(--mesh),var(--bg)}
.auth-card{border-top:0;box-shadow:0 24px 70px rgba(80,70,120,.16);position:relative;overflow:hidden;border:1px solid var(--line)}
.auth-card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--rainbow)}
.logo{background:none!important;color:inherit;width:auto;height:auto;border-radius:0}

/* الشريط العلوي */
.top{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);border-bottom:1px solid var(--line)}
.top::after{content:"";display:block;height:4px;background:var(--rainbow)}
.top .sub{opacity:1;color:var(--muted)}
.nav{background:#f1eef6;border-radius:14px}
.nav button{color:#687386;border-radius:11px;padding:.35em .85em}
.nav button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(80,70,120,.14)}
.user .who span{opacity:1;color:var(--muted)}
.top .btn.ghost{color:var(--muted)}
.top .btn.ghost:hover{background:#f1eef6}

/* التبويبات والأقسام */
.tab{border-radius:18px;background:rgba(255,255,255,.8)}
.tab .ic,.tab.on .ic,.tab.on.gold .ic{background:none;width:auto;height:auto;color:inherit}
.tab.on{background:linear-gradient(135deg,#eafaf6,#ffffff);border-color:var(--teal)}
.tab.on.gold{background:linear-gradient(135deg,#fff5e0,#ffffff);border-color:var(--gold)}
.catchip{padding:.25em 1em .25em .7em;min-height:44px;border-radius:16px;box-shadow:0 2px 6px rgba(80,70,120,.05)}
.catchip.on{box-shadow:0 8px 18px rgba(80,70,120,.18)}
.chip.on{box-shadow:0 6px 14px rgba(15,154,130,.22)}
.budget{border-radius:16px}
.band4{color:#5a3a06!important}
.grid thead tr.bands th{color:#fff;font-weight:700}
.grid .namecol{box-shadow:-6px 0 8px -6px rgba(80,70,120,.12)}
.grid th.tot,.grid td.tot{box-shadow:6px 0 8px -6px rgba(80,70,120,.12)}
.grid tr.hl td{background:#fff3d9!important}
.grid th.item .no{border-color:var(--gold);color:var(--teal-d)}
.cnt.has{border-color:#b9ecdf}
.done{box-shadow:0 4px 10px rgba(15,154,130,.25)}
.cathead{gap:8px}

/* النوافذ والإشعارات */
dialog{box-shadow:0 30px 80px rgba(80,70,120,.25);border:1px solid var(--line)}
dialog::backdrop{background:rgba(150,140,180,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dlg-h{background:linear-gradient(135deg,#eefbf8,#f6f1ff)}
.toast{color:var(--ink);border:1px solid var(--line);border-inline-start:6px solid var(--teal);box-shadow:0 14px 34px rgba(80,70,120,.2)}
.toast.bad{background:#fff5f4;border-color:#f7cfcb;border-inline-start-color:var(--rose);color:#8f2a22}
.toast button{background:#f1eef6;color:var(--ink)}
.occ-n{background:var(--teal-l)}

/* لوحة العرض للطالبات */
.disp{background:var(--mesh),var(--bg);color:var(--ink)}
.disp-h p{opacity:1;color:var(--muted)}
.disp-tools .seg{background:#efecf5} .disp-tools .seg button{color:#687386} .disp-tools .seg button.on{background:#fff;color:var(--ink)}
.disp .btn.ghost{color:var(--ink);border-color:var(--line);background:rgba(255,255,255,.7)}
.disp .btn.ghost.on{background:var(--teal);border-color:var(--teal);color:#fff}
.disp .legend{color:var(--ink)}
.dcard{box-shadow:0 10px 28px rgba(80,70,120,.1);border:1.500px solid var(--line);border-radius:22px}
.dcard.star{border-color:#ffd58a;background:linear-gradient(180deg,#fff8e8,#ffffff)}
.dcard .big{color:var(--gold-d)}
.disp-foot{opacity:1;color:var(--muted)}

/* بوابة أولياء الأمور */
.pwrap{background:var(--mesh),var(--bg)}
.phead{background:rgba(255,255,255,.7);color:var(--ink);border-bottom:0;position:relative;padding-bottom:20px}
.phead::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--rainbow)}
.phead p{opacity:1;color:var(--muted)}
.pbody{margin-top:16px}
.pcat{border-radius:16px;gap:8px} .pcat span{flex:1}
.pcard{font:inherit;color:inherit;text-align:start;cursor:pointer;display:block;width:100%}
.pcard:hover{border-color:var(--teal)} .pcard:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.ptotal b{background:linear-gradient(135deg,#0f9a82,#5b9bf0);-webkit-background-clip:text;background-clip:text;color:transparent}
.legend span{gap:5px}
@media (max-width:760px){.nav button{flex-direction:column;gap:1px;font-size:12.500px;padding:.35em .2em;white-space:nowrap;min-width:0}.nav .lic svg{width:26px;height:26px}}
/* أزرار المؤشرات */
.indbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1.500px solid color-mix(in srgb,var(--c) 35%,#fff);background:var(--s);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;font-size:16.500px;cursor:pointer;min-height:56px}
.indbtn:hover{border-color:var(--c);box-shadow:0 4px 12px rgba(80,70,120,.12)} .indbtn:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.occ-ind{display:flex;align-items:center;gap:6px;margin-top:6px;font-weight:700;color:#8a5a08;background:#fff6dd;border-radius:8px;padding:5px 10px;font-size:14.500px}
/* هوية «نجوم الخنساء» والعناوين */
.appname{font-weight:700;letter-spacing:0;background:linear-gradient(90deg,#c27408,#e0621c 50%,#8a55c2);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .appname{font-size:30px;line-height:1.2} .brand p{margin:2px 0 0} .brand p.school{font-size:13px;color:var(--muted)}
.top h1.appname{font-size:22px}
.pagehead{display:flex;align-items:center;gap:14px;margin:4px 0 16px;padding:14px 18px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--tone) 14%,#fff),#fff 70%);border:1px solid color-mix(in srgb,var(--tone) 28%,#fff);border-inline-start:6px solid var(--tone)}
.pagehead h2{font-size:24px;font-weight:700;color:var(--ink)} .pagehead p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.ph-ic{width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(80,70,120,.1);flex:none}
.blocklabel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16.5px;color:var(--ink);margin:6px 0 4px}
.blocklabel::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--line),transparent)}
.card > .blocklabel{margin-top:0}
.section-title{font-size:19.500px;padding-inline-start:12px;border-inline-start:5px solid var(--teal);margin:6px 0 12px;line-height:1.4}
.subtabs{gap:6px;border-bottom:0;background:#f4f1f8;padding:6px;border-radius:16px;margin-bottom:18px}
.subtabs button{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;margin:0;padding:.5em .95em;color:#5e6878;font-size:15.500px}
.subtabs button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(80,70,120,.14)}
.tab b{font-size:17.500px}
.dlg-h h2{font-size:19px}
.phead .pclass,.disp-h .pclass{font-size:19px;font-weight:700;color:var(--ink);opacity:1;margin:2px 0}
.phead h1.appname{font-size:30px} .disp-h h1.appname{font-size:clamp(30px,3.6vw,48px)}
/* خانات التاريخ على الآيباد لا تخرج عن البطاقة */
.g2>*{min-width:0} input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block}
@media (max-width:760px){.pagehead{padding:10px 12px;gap:10px}.pagehead h2{font-size:20px}.ph-ic{width:46px;height:46px}.brand .appname{font-size:26px}.top h1.appname{font-size:18px}}
@media print{body{background:#fff}.top::after{display:none}.pagehead{display:none}}

/* القائمة الرئيسية بألوان لافتة: لكل زر لونه، والمفتوح بارز بإطار وظل */
.top .nav{background:transparent!important;padding:0;gap:8px}
.top .nav button{--c:#0f9a82;--c2:#13b897;background:linear-gradient(135deg,var(--l1),var(--l2))!important;color:var(--t)!important;font-weight:700;border-radius:14px!important;padding:.4em 1em .4em .8em!important;box-shadow:0 3px 8px color-mix(in srgb,var(--c) 30%,transparent)!important;opacity:1;transition:transform .15s,opacity .15s,box-shadow .15s}
.top .nav button[data-v=record]{--c:#12a185;--l1:#d6f5ec;--l2:#a9e9d7;--t:#05584a}
.top .nav button[data-v=reports]{--c:#3f74e0;--l1:#dde8fd;--l2:#b5cdfa;--t:#1c3f8f}
.top .nav button[data-v=display]{--c:#d4569c;--l1:#fde0ef;--l2:#f8bcdc;--t:#86225a}
.top .nav button[data-v=admin]{--c:#e48a2a;--l1:#fdead3;--l2:#f9cf9c;--t:#86460a}
.top .nav button:hover{opacity:1;transform:translateY(-1px)}
.top .nav button.on{opacity:1;transform:translateY(-1px);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c),0 8px 18px color-mix(in srgb,var(--c) 45%,transparent)!important}
.top .nav .nv-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#fff;flex:none}
.top .nav button:focus-visible{outline:3px solid var(--c);outline-offset:4px}
@media (max-width:760px){.top .nav{gap:5px;padding:4px 0}.top .nav button{padding:.35em .2em!important;font-size:12.5px;border-radius:12px!important}.top .nav .nv-ic{width:28px;height:28px}.top .nav .nv-ic .lic svg{width:20px;height:20px}}

/* زر السلوك الإيجابي ونافذة التصرفات */
.behbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:var(--s);color:var(--k);font:inherit;font-weight:700;font-size:14.5px;border-radius:999px;padding:5px 12px 5px 10px;cursor:pointer;white-space:nowrap;transition:transform .12s,box-shadow .12s}
.behbtn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px color-mix(in srgb,var(--c) 30%,transparent)}
.behbtn:disabled{opacity:.6;cursor:default}
.behbtn.big{font-size:16px;padding:8px 16px 8px 12px}
.behbtn:focus-visible{outline:3px solid var(--c);outline-offset:2px}
th.behcol,td.behcol{text-align:center;padding-inline:10px;white-space:nowrap}
.behgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.behgrp{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fffdf6;display:grid;gap:6px;align-content:start}
.behgrp h4{margin:0 0 2px;font-size:16.5px;color:#7a5200;display:flex;align-items:center;gap:8px}
.behgrp h4 .no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e3a116;color:#fff;font-size:13px}
.behgrp .indbtn{padding:8px 10px;font-size:14.5px;min-height:0}

/* طباعة التقارير المقسّمة (أفقي، رأس متكرر في كل صفحة) */
#printArea{display:none}
@media print{
  body.print-rep > *:not(#printArea){display:none!important}
  body.print-rep #printArea{display:block}
  body.print-rep{background:#fff!important}
  #printArea{font-family:var(--font);color:#000;direction:rtl;text-align:right}
  .pp-m{direction:rtl}
  .pp{break-after:page;page-break-after:always;width:100%;display:block}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .pp-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10mm;border-bottom:.6mm solid #000;padding-bottom:2mm;margin-bottom:2.5mm}
  .pp-t{font-size:17pt;display:block;line-height:1.2} .pp-c{font-size:14pt;font-weight:700;line-height:1.3}
  .pp-m{font-size:9.5pt;text-align:left;line-height:1.35;color:#222}
  table.pt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:11pt}
  .pt th,.pt td{border:.25mm solid #555;padding:1mm .6mm;text-align:center;vertical-align:middle;overflow-wrap:anywhere}
  .pt td{overflow:hidden}
  .pt thead th{background:#ececec!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:8pt;line-height:1.2;font-weight:700;vertical-align:bottom;padding-bottom:1.2mm}
  .pt td{height:7.4mm;line-height:1.2}
  .pp.pr .pt td{height:6.3mm;padding-top:.4mm;padding-bottom:.4mm}
  .pt th.nm,.pt td.nm{text-align:right;padding-inline:1.5mm}
  .pt td.nm{font-weight:700;font-size:10.5pt}
  .pt .fin{background:#f6f0dc!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-weight:700;font-size:12pt}
  .pt thead th.fin{font-size:8.6pt}
  .pt tbody tr:nth-child(even) td{background:#fafafa!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pt tbody tr:nth-child(even) td.fin{background:#f1e9cf!important}
  .pno{display:block;font-size:8pt;color:#555;font-weight:400}
  .pp-n{font-size:9pt;margin:1.5mm 0 0;color:#333}

  // الرابط قد يحمل إعداد الاتصال (c=...) وعلامة بوابة أولياء الأمور (parent)
  try {
    const parts = location.hash.replace(/^#/, '').split('&').filter(Boolean);
    const k = parts.find(x => x.startsWith('k='));
    S.pkey = k ? k.slice(2) : null; S.parent = !!S.pkey;
    const c = parts.find(x => x.startsWith('c='));
    if (c) {
      const j = JSON.parse(decodeURIComponent(escape(atob(c.slice(2).replace(/-/g, '+').replace(/_/g, '/')))));
      if (j.u && j.k !== undefined) localStorage.setItem('kh_cfg', JSON.stringify({ url: j.u, key: j.k }));
      history.replaceState(null, '', location.pathname + location.search + (S.parent ? '#k=' + S.pkey : ''));
    }
  } catch (e) {}
  if (CONFIG.url) return { url: CONFIG.url.replace(/\/+$/, ''), key: CONFIG.key };

}

async function rpc(fn, args = {}, auth = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.cfg.key) { headers.apikey = S.cfg.key; if (S.cfg.key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + S.cfg.key; }
  let res;
  try {
    res = await fetch(S.cfg.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers, body: JSON.stringify(auth ? { p_token: S.token, ...args } : args) });
  } catch (e) { const err = new Error('تعذر الاتصال بالخادم. تحققي من الإنترنت ثم أعيدي المحاولة.'); err.net = true; throw err; }
  let data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.message) || ('خطأ في الخادم (' + res.status + ')')); err.hint = data && data.hint;
    if (data && data.hint === 'SESSION') { err.session = true; if (!S.parent) signedOut(); }
    if (res.status >= 500) err.net = true;

}
// إعادة المحاولة بالمعرّف نفسه: الخادم لا ينشئ واقعة ثانية للطلب نفسه
async function rpcRetry(fn, args) {
  for (let i = 0; ; i++) {
    try { return await rpc(fn, args); }
    catch (e) { if (!e.net || i >= 2) throw e; await sleep(700 * (i + 1)); }
  }
}

    if (key !== [S.classId, S.termId, S.preset, S.from, S.to].join('|')) return;

function applyResult(r, deltaCount) {
  setBudget(r.budget);

    const it = item(rec.item_id);

  }

  refreshRow(rec.student_id);
}

async function addRecord(st, it, opts = {}) {
  const key = st.id + ':' + it.id;

    applyResult(r, r.duplicate ? 0 : 1); out = r;
    const aw = r.record.award, b = r.budget;
    const msg = (aw ? `مُنحت ${ptsWord(aw)}:` : it.kind === 'practice' ? 'رُصدت في الدرجات:' : 'سُجّل بدون نقاط:') + ` «${it.short}» — ${who}` + (aw && b && !b.unlimited && !it.counselor_only && it.cat !== 'activity' ? ` · المتبقي من رصيدك ${Math.max(0, b.limit - b.used)}` : '');
    if (!opts.quiet) toast(msg, { actions: [
      { label: 'ملاحظة', fn: () => openCell(st, it, r.record.id) },
      { label: 'تراجع', fn: async () => { try { const d = await rpc('kh_record_delete', { p_id: r.record.id }); applyResult(d, -1); toast('تم التراجع'); } catch (e) { oops(e); } } }] });
  } catch (e) {

    else if (e.hint === 'BUDGET' && it.kind === 'practice') toast(e.message + '. يمكن تسجيل الممارسة للدرجات الرسمية دون نقاط.', { bad: true, ms: 9000, actions: [{ label: 'تسجيل بدون نقاط', fn: () => addRecord(st, it, { ...opts, award: false }) }] });

}

function xlsx(sheets) {
  const esc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    '<cols>' + sh.rows[0].map((_, i) => `<col min="${i + 1}" max="${i + 1}" width="${(sh.widths && sh.widths[i]) || 14}" customWidth="1"/>`).join('') + '</cols><sheetData>' +
    sh.rows.map((r, ri) => `<row r="${ri + 1}">` + r.map((v, ci) => {
      const ref = col(ci) + (ri + 1), st = ri === 0 ? ' s="1"' : '';

      if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${st}><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${esc(v)}</t></is></c>`;

    ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>'],
    ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      sheets.map((s, i) => `<sheet name="${esc(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
      `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0F9A82"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],

function zip(files) {

  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }

  for (const [name, text] of files) {
    const nb = enc.encode(name), data = enc.encode(text), c = crc(data);
    const lh = hdr(0x04034b50, 30, c, data.length, nb.length, (v, c, l, nl) => { v.setUint16(4, 20, true); v.setUint16(6, 0x0800, true); v.setUint16(8, 0, true); v.setUint16(10, 0, true); v.setUint16(12, 0x21, true); v.setUint32(14, c, true); v.setUint32(18, l, true); v.setUint32(22, l, true); v.setUint16(26, nl, true); v.setUint16(28, 0, true); });
    const ch = hdr(0x02014b50, 46, c, data.length, nb.length, (v, c, l, nl) => { v.setUint16(4, 20, true); v.setUint16(6, 20, true); v.setUint16(8, 0x0800, true); v.setUint16(10, 0, true); v.setUint16(12, 0, true); v.setUint16(14, 0x21, true); v.setUint32(16, c, true); v.setUint32(20, l, true); v.setUint32(24, l, true); v.setUint16(28, nl, true); v.setUint32(42, off, true); });
    parts.push(lh, nb, data); cd.push(ch, nb); off += lh.length + nb.length + data.length;

  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true); ev.setUint32(12, cdLen, true); ev.setUint32(16, off, true);
